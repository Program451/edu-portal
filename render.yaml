services:
  - type: web
    name: edu-portal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >
      npm install &&
      curl -L https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64-static.tar.gz
      | tar -xz -C /opt/render/project/src
    startCommand: >
      mkdir -p /opt/render/project/src/data &&
      ./litestream replicate -config litestream.yml -exec "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
